name: Build & Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:     # allow manual trigger for testing

jobs:
  build-wheels:
    name: Wheels / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]

    steps:
      - uses: actions/checkout@v4

      # Check out numsim-cas alongside
      - uses: actions/checkout@v4
        with:
          repository: https://github.com/NumSim-Stack/numsim-cas.git
          ref: move_to_virtual
          path: numsim-cas-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cibuildwheel
        run: pip install cibuildwheel

      - name: Build wheels
        run: cibuildwheel --output-dir wheelhouse
        env:
          NUMSIM_CAS_SOURCE_DIR: ${{ github.workspace }}/numsim-cas-src
          # Pass env into Linux Docker containers
          CIBW_ENVIRONMENT_PASS_LINUX: NUMSIM_CAS_SOURCE_DIR
          CIBW_ARCHS_MACOS: "arm64 x86_64"
          CIBW_ARCHS_LINUX: "x86_64"
          CIBW_ARCHS_WINDOWS: "AMD64"

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  build-sdist:
    name: Source distribution
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build sdist
        run: pip install build && python -m build --sdist

      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    name: Publish to PyPI
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-24.04
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # trusted publishing (no API token needed)

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
